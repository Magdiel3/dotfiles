theme = "github-dark-default"
mode = "unified"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = false
agent_notes = true
copy_decorations = false
cursor_line = "row"
prompt_save_view_preferences = true
sidebar = false

[keybindings]
"hunk-commit-log.next" = "P"
"hunk-commit-log.message" = "i"
